name: Bug report
description: Something in Baa behaves incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The most useful thing you can give us is a small
        `.baa` file that misbehaves.

        Security issues should **not** go here: see [SECURITY.md](https://github.com/PatrickJnr/sheep/blob/main/SECURITY.md).

  - type: textarea
    id: program
    attributes:
      label: A program that reproduces it
      description: The smallest `.baa` file that shows the problem.
      render: baa
      placeholder: |
        const flock = ["Dolly"]
        baa flock[0]
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: The command you ran
      placeholder: baa run bug.baa
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the full output, including any diagnostic.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `baa doctor`.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest release or `main`
          required: true
        - label: I searched existing issues
          required: true
