name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Baa's own test blocks
        run: node src/cli/index.ts test tests/programs

      - name: Run every example
        shell: bash
        run: |
          for file in examples/*.baa; do
            echo "--- $file"
            node src/cli/index.ts run "$file" > /dev/null
          done

  quality:
    name: format, lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Formatter is a fixed point
        run: node src/cli/index.ts fmt --check examples tests/programs

      - name: Linter is clean
        run: node src/cli/index.ts lint --deny-warnings examples tests/programs

      - name: Generated docs are up to date
        run: node tools/gen-docs.ts --check

      - name: Conformance suite is up to date
        run: node tools/gen-conformance.ts --check

      - name: Brand images are committed
        run: node tools/render-assets.ts --check

      - name: Diagnostics read plainly in CI
        run: node src/cli/index.ts --no-baa check examples

  cli:
    name: cli smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: A new project works end to end
        run: |
          node src/cli/index.ts --version
          node src/cli/index.ts doctor
          mkdir -p /tmp/flock && cd /tmp/flock
          node "$GITHUB_WORKSPACE/src/cli/index.ts" init . --name ci_flock
          node "$GITHUB_WORKSPACE/src/cli/index.ts" run
          node "$GITHUB_WORKSPACE/src/cli/index.ts" test
          node "$GITHUB_WORKSPACE/src/cli/index.ts" build
          node "$GITHUB_WORKSPACE/src/cli/index.ts" fmt --check .

      # The published package is a different artefact from the checkout, and
      # only this step exercises it. 0.2.0 shipped `.ts` sources with `bin`
      # pointing at one, installed cleanly, and then failed on first run:
      # Node refuses to strip types under node_modules. Everything above this
      # passed for that release, because it all runs from the checkout.
      - name: The tarball works when installed
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/baa-lang-*.tgz
          {
            echo 'baa "installed"'
            echo 'baa 2 + 3'
          } > check.baa
          ./node_modules/.bin/baa version
          ./node_modules/.bin/baa run check.baa | tee out.txt
          grep -qx 'installed' out.txt
          grep -qx '5' out.txt
