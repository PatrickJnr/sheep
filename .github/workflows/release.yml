name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  # Required by `npm publish --provenance`, which signs the package against
  # this workflow run. Without it the publish step fails at the last moment.
  id-token: write

jobs:
  verify:
    name: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run ci

  release:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    # Lifted to the job so a step's `if:` can read it. The `secrets` context is
    # not available in `if:` at all: using it there is a validation error, which
    # fails the whole file at startup rather than the one step. That is why this
    # workflow reported a failure on every push while defining no jobs.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Tag matches package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$version"
          test "$tag" = "v$version"

      - name: Extract the changelog entry
        id: notes
        run: |
          version=$(node -p "require('./package.json').version")
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Build the distribution tarball
        run: npm pack

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: "*.tgz"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Skipped, not failed, when no token is configured: a GitHub release is
      # useful on its own and should not depend on npm being set up.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
