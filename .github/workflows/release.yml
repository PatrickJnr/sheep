name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  # Trusted publishing authenticates to npm with a short-lived OIDC token
  # minted for this workflow run, so there is no npm token stored anywhere.
  # Without this permission there is nothing to authenticate with.
  id-token: write

jobs:
  verify:
    name: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run ci

  extension:
    name: build the vsix
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Tag matches the extension
        # The extension ships the client for one version of the server, and a
        # test asserts the two version numbers are equal. Checking it here as
        # well means a mismatched tag fails before anything is published
        # rather than after.
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(node -p "require('./editors/vscode/package.json').version")
          echo "tag=$tag extension=$version"
          test "$tag" = "v$version"

      - name: Build it
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: baa-lang-vsix
          path: editors/vscode/baa-lang.vsix
          if-no-files-found: error

      - name: Publish to the marketplace
        # Only when a token exists. Without one the release still carries the
        # VSIX, which is how the extension is installed today; adding the
        # secret is what turns that into a marketplace listing, and nothing
        # here needs changing when it does.
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::No VSCE_PAT secret, so the extension is not published to the marketplace. The VSIX is attached to the release."
            exit 0
          fi
          npx vsce publish --packagePath baa-lang.vsix --pat "$VSCE_PAT"

  runtimes:
    name: native runtime (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            # Two binaries on Windows: the subsystem is a link-time flag, which
            # is the same reason python.exe and pythonw.exe both exist. The
            # windowed one has no console behind the application.
            binaries: baa-native.exe baa-nativew.exe
          - os: ubuntu-latest
            target: linux-x64
            binaries: baa-native
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Collect, with checksums
        shell: bash
        run: |
          mkdir -p dist
          for binary in ${{ matrix.binaries }}; do
            cp "rust/target/release/$binary" dist/
          done
          cd dist
          # The checksum file is the point of publishing binaries at all: an
          # artefact nobody can verify is an artefact nobody should run.
          sha256sum * > "baa-native-${{ matrix.target }}.sha256"
          cat "baa-native-${{ matrix.target }}.sha256"

      - name: Archive
        shell: bash
        run: |
          cd dist
          tar -czf "../baa-native-${{ matrix.target }}.tar.gz" .
          cd ..
          sha256sum "baa-native-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: baa-native-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [verify, extension, runtimes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships something
      # close to it, which is not the same as new enough.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Tag matches package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$version"
          test "$tag" = "v$version"

      - name: Extract the changelog entry
        id: notes
        run: |
          version=$(node -p "require('./package.json').version")
          # `[[]` and `[]]` are the portable way to match a literal bracket.
          # `\[` is a GNU extension: gawk warns and then reads it as the start
          # of a character class, so the match finds nothing and the release
          # ships with empty notes. This worked only because Ubuntu runners
          # default to mawk, which is lenient about it.
          awk -v v="$version" '
            $0 ~ "^## [[]" v "[]]" { found = 1; next }
            found && /^## [[]/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Build the distribution tarball
        run: npm pack

      - name: Collect the VSIX built alongside
        uses: actions/download-artifact@v4
        with:
          name: baa-lang-vsix

      - name: Collect the native runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          merge-multiple: true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          # The npm tarball and the editor extension. The VSIX is here because
          # the marketplace is not the only way to install it: an air-gapped
          # machine has a release asset instead.
          files: |
            *.tgz
            baa-lang.vsix
            baa-native-*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # No token, and no `--provenance` flag. Trusted publishing authenticates
      # over OIDC and adds provenance by itself when the build qualifies, which
      # a public repository does. Passing the flag explicitly would fail rather
      # than be ignored, so it stays out either way.
      #
      # A trusted publisher is configured on the package's own settings page,
      # so it cannot be set up before the package exists. Until someone runs
      # `npm publish` once by hand, this step says so and stops, rather than
      # turning every release red over a step that was never going to work.
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if ! npm view "$name" version > /dev/null 2>&1; then
            echo "::notice::$name is not on the registry yet. Publish it once with \`npm publish --access public\`, then add a trusted publisher for PatrickJnr/sheep and this workflow file. Until then the GitHub release is the release."
            exit 0
          fi

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already published, nothing to do."
            exit 0
          fi

          npm publish --access public
