<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Baa">
  <title>Baa</title>
  <!--
    Bold-keyline construction. The fleece is drawn twice: once fat and dark to
    create a single unified outline, then again in wool on top. Because each
    layer is one colour, no seams appear where the twelve lobes overlap.
    Ears sit behind the topknot and face, which are drawn with their own
    keyline so they read as separate planes.
  -->
